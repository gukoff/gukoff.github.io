      max-width: 100%;
      height: auto;
      overflow: visible;
      user-select: none;
    }

    .cell-base {
      fill: #ffffff;
    }

    .cell-base.center {
      fill: #d9dde3;
    }

    .guide-line {
      fill: none;
      stroke: #4f74d6;
      stroke-width: 5;
      stroke-linecap: round;
      opacity: .38;
      vector-effect: non-scaling-stroke;
    }

    .cell-outline {
      fill: none;
      stroke: #28313a;
      stroke-width: 2.6;
      vector-effect: non-scaling-stroke;
    }

    .cell-outline.center {
      stroke-width: 3.2;
    }

    .cell-outline.pos {
      stroke: #1f8f45;
      stroke-width: 4.1;
    }

    .cell-outline.neg {
      stroke: #c53a32;
      stroke-width: 4.1;
    }

    .ring-wash.pos {
      fill: #39b867;
      opacity: .18;
    }

    .ring-wash.neg {
      fill: #e85c55;
      opacity: .18;
    }

    .number {
      fill: #1c232b;
      font: 500 34px/1 Arial, Helvetica, sans-serif;
      text-anchor: middle;
      dominant-baseline: central;
      stroke: #ffffff;
      stroke-width: 7;
      paint-order: stroke fill;
      vector-effect: non-scaling-stroke;
    }

    .number.pos {
      fill: #1f8f45;
      font-weight: 700;
    }

    .number.neg {
      fill: #c53a32;
      font-weight: 700;
    }

    .number.center {
      fill: #111418;
      stroke: #d9dde3;
      font-weight: 700;
    }

    .caption {
      fill: #59636f;
      font: 500 19px/1.25 Arial, Helvetica, sans-serif;
      text-anchor: middle;
    }

    .equation-pos {
      fill: #1f8f45;
      font-weight: 700;
    }

    .equation-neg {
      fill: #c53a32;
      font-weight: 700;
    }

    .equation-note {
      fill: #4f74d6;
      font-weight: 700;
    }
</style>
