<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 560" width="620" height="560" role="img" aria-labelledby="title desc" id="alternating-ring-order3">
  <title id="title">Alternating ring preserves the line sums</title>
  <desc id="desc">An order-3 hexagonal grid. The six cells around the center carry alternating plus one and minus one. Only the three parallel lines in one direction are drawn; the other two directions behave the same by symmetry. Each shown line passes through exactly one plus one and one minus one, so its contribution is zero.</desc>

  <style>
